server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax
        name: ABHISARAN_SESSION

spring:
  application:
    name: abhisaran-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/abhisaran}
    username: ${SPRING_DATASOURCE_USERNAME:abhisaran_user}
    password: ${SPRING_DATASOURCE_PASSWORD:abhisaran_local_password_secure_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

abhisaran:
  security:
    jwt-secret: ${JWT_SECRET:super_secure_abhisaran_jwt_secret_key_at_least_32_bytes_long_2026}
    bootstrap-admin-id: ${BOOTSTRAP_ADMIN_ID:admin}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin#Bootstrap2026!}
  ai:
    enabled: ${FEATURE_AI:true}
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    service-token: ${AI_SERVICE_TOKEN:abhisaran-internal-ai-token-2026}
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:8000}
